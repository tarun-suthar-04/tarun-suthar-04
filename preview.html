<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarun Suthar · Developer Profile Preview</title>
  <style>
    @font-face { font-family: 'TeX Gyre Adventor'; font-style: normal; font-weight: 400 500; font-display: swap; src: url('fonts/texgyreadventor-regular.otf') format('opentype'); }
    @font-face { font-family: 'TeX Gyre Adventor'; font-style: italic; font-weight: 400 500; font-display: swap; src: url('fonts/texgyreadventor-italic.otf') format('opentype'); }
    @font-face { font-family: 'TeX Gyre Adventor'; font-style: normal; font-weight: 600 900; font-display: swap; src: url('fonts/texgyreadventor-bold.otf') format('opentype'); }
    @font-face { font-family: 'TeX Gyre Adventor'; font-style: italic; font-weight: 600 900; font-display: swap; src: url('fonts/texgyreadventor-bolditalic.otf') format('opentype'); }
    @font-face { font-family: 'Instrument Serif'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/serif-400.woff') format('woff'); }
    @font-face { font-family: 'Instrument Serif'; font-style: italic; font-weight: 400 700; font-display: swap; src: url('fonts/serif-italic.woff') format('woff'); }
    @font-face { font-family: 'Geist Mono'; font-style: normal; font-weight: 400 700; font-display: swap; src: url('fonts/geistmono-400.woff') format('woff'); }

    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --font-sans: 'TeX Gyre Adventor', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-serif: 'Instrument Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

      --page-bg: #f4f5f7;
      --nav-bg: rgba(15, 18, 24, 0.88);
      --nav-border: rgba(255, 255, 255, 0.1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: var(--font-sans);
      letter-spacing: -0.028em;
      background: var(--page-bg);
      color: #0f172a;
      padding-top: 84px;
      padding-bottom: 56px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background 240ms var(--ease-out);
    }

    /* ------------------------------------------------------------------
       Theme Tokens scoped to .profile-shell so Light, Dark, Side-by-Side
       and Adaptive modes all render with exact contrast & zero collision
    ------------------------------------------------------------------ */
    .profile-shell {
      --bg-canvas: #f7f8fa;
      --bg-card: #ffffff;
      --bg-card-subtle: #f1f3f6;
      --bg-tile: rgba(255, 255, 255, 0.72);
      --bg-pill: rgba(255, 255, 255, 0.86);
      --border-hairline: rgba(15, 23, 42, 0.08);
      --border-strong: rgba(15, 23, 42, 0.14);
      --border-glass: rgba(255, 255, 255, 0.78);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --shadow-card: 0 10px 30px -14px rgba(15, 23, 42, 0.10), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-pill: 0 10px 24px -8px rgba(15, 23, 42, 0.18), 0 2px 6px rgba(15, 23, 42, 0.06);
      --accent-green: #0d6e4c;
      --accent-green-bright: #16a34a;
      --accent-red: #dc2626;
      --accent-amber: #f5b700;
      --accent-amber-ink: #0f172a;
      --accent-cobalt: #2563eb;
      --bar-muted: #e2e8f0;
      --grid-line: rgba(15, 23, 42, 0.045);
      --cube-hi: rgba(255, 255, 255, 0.78);
      --cube-lo: rgba(15, 23, 42, 0.07);
      --cube-stroke: rgba(255, 255, 255, 0.72);
      --heat-0: #eef2f6;
      --heat-1: #bbf7d0;
      --heat-2: #6ee7b7;
      --heat-3: #10b981;
      --heat-4: #065f46;
      --hero-art-bg: #f3f1e7;

      background: var(--bg-canvas);
      color: var(--text-primary);
      border: 1px solid var(--border-hairline);
      border-radius: 28px;
      padding: 24px;
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
    }

    .profile-shell[data-theme="dark"] {
      --bg-canvas: #0b0e14;
      --bg-card: #111620;
      --bg-card-subtle: #161c28;
      --bg-tile: rgba(22, 28, 40, 0.78);
      --bg-pill: rgba(24, 31, 44, 0.84);
      --border-hairline: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.16);
      --border-glass: rgba(255, 255, 255, 0.16);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --shadow-card: 0 20px 44px -18px rgba(0, 0, 0, 0.7), 0 1px 0 rgba(255, 255, 255, 0.04) inset;
      --shadow-pill: 0 12px 28px -8px rgba(0, 0, 0, 0.65);
      --accent-green: #34d399;
      --accent-green-bright: #4ade80;
      --accent-red: #f87171;
      --accent-amber: #fbbf24;
      --accent-amber-ink: #0b0e14;
      --accent-cobalt: #60a5fa;
      --bar-muted: #222b3a;
      --grid-line: rgba(255, 255, 255, 0.04);
      --cube-hi: rgba(255, 255, 255, 0.22);
      --cube-lo: rgba(0, 0, 0, 0.42);
      --cube-stroke: rgba(255, 255, 255, 0.14);
      --heat-0: #171e2b;
      --heat-1: #064e3b;
      --heat-2: #047857;
      --heat-3: #10b981;
      --heat-4: #4ade80;
      --hero-art-bg: #f3f1e7;
    }

    /* ------------------------------------------------------------------
       Top Bar (3-zone contract: Brand — Nav Links — Mode Switcher)
    ------------------------------------------------------------------ */
    .top-bar {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: min(1160px, calc(100vw - 24px));
      height: 56px;
      padding: 0 12px 0 20px;
      border-radius: 16px;
      background: var(--nav-bg);
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
      border: 1px solid var(--nav-border);
      box-shadow: 0 14px 36px -12px rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      z-index: 1000;
    }

    .brand-wordmark {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.04em;
      color: #f8fafc;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .top-nav {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .top-nav a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.025em;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 160ms var(--ease-out);
      position: relative;
      padding: 6px 2px;
    }

    .top-nav a:hover {
      color: #f8fafc;
    }

    .top-nav a:focus-visible,
    .mode-switch button:focus-visible,
    a:focus-visible {
      outline: 2px solid #60a5fa;
      outline-offset: 2px;
      border-radius: 6px;
    }

    .mode-switch {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    .mode-switch button {
      border: none;
      background: transparent;
      color: #94a3b8;
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: -0.025em;
      padding: 7px 13px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 160ms var(--ease-out), color 160ms var(--ease-out);
    }

    .mode-switch button:hover {
      color: #f8fafc;
    }

    .mode-switch button.active {
      background: #ffffff;
      color: #0f172a;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    /* ------------------------------------------------------------------
       Main Preview Wrappers
    ------------------------------------------------------------------ */
    .preview-container {
      max-width: 1020px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .split-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      max-width: 1840px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .split-layout .profile-shell {
      padding: 18px;
    }

    .shell-meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px 16px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border-hairline);
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .shell-meta-bar strong {
      color: var(--text-secondary);
      font-weight: 600;
    }

    /* ------------------------------------------------------------------
       Shared Card & Cubic Glass Pattern Primitives
       Inspired by References 1–6: crisp hairline borders + beveled
       frosted square glass tiles refracting luminous mesh gradients
    ------------------------------------------------------------------ */
    .stack-col {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border-hairline);
      border-radius: 24px;
      padding: 32px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
      transition: transform 200ms var(--ease-out), border-color 200ms var(--ease-out);
    }

    .card-interactive:hover {
      transform: translateY(-2px);
      border-color: var(--border-strong);
    }

    .kicker {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 14px;
    }

    .kicker-accent {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .serif-italic {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    /* Cubic Glass Grid Overlay (SVG-backed bevelled tiles) */
    .cubic-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .cubic-mesh {
      position: absolute;
      inset: 0;
      filter: blur(28px);
      opacity: 0.85;
    }

    .profile-shell[data-theme="dark"] .cubic-mesh {
      opacity: 0.68;
    }

    .cubic-tiles {
      position: absolute;
      inset: 0;
      background-size: 36px 36px;
      background-image:
        linear-gradient(135deg, var(--cube-hi) 0%, transparent 48%, var(--cube-lo) 100%),
        linear-gradient(to right, var(--cube-stroke) 1px, transparent 1px),
        linear-gradient(to bottom, var(--cube-stroke) 1px, transparent 1px);
      mix-blend-mode: overlay;
    }

    .profile-shell[data-theme="light"] .cubic-tiles {
      mix-blend-mode: soft-light;
    }

    .cubic-bevel-grid {
      position: absolute;
      inset: 0;
      opacity: 0.92;
    }

    .card > *:not(.cubic-layer):not(.vertical-rules) {
      position: relative;
      z-index: 1;
    }

    /* Subtle vertical editorial hairline rules (from Reference 4) */
    .vertical-rules {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(to right, var(--grid-line) 1px, transparent 1px);
      background-size: 56px 100%;
      z-index: 0;
    }

    /* ------------------------------------------------------------------
       01. Hero Card
    ------------------------------------------------------------------ */
    .hero-card {
      padding: 36px;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(240px, 0.9fr);
      gap: 32px;
      align-items: center;
    }

    .hero-cubic-zone {
      mask-image: radial-gradient(ellipse 85% 90% at 88% 82%, #000 18%, rgba(0,0,0,0.4) 55%, transparent 82%);
      -webkit-mask-image: radial-gradient(ellipse 85% 90% at 88% 82%, #000 18%, rgba(0,0,0,0.4) 55%, transparent 82%);
    }

    .hero-mesh {
      background:
        radial-gradient(circle at 82% 85%, rgba(16, 185, 129, 0.42), transparent 48%),
        radial-gradient(circle at 52% 96%, rgba(251, 191, 36, 0.36), transparent 46%),
        radial-gradient(circle at 95% 25%, rgba(37, 99, 235, 0.28), transparent 45%);
    }

    .hero-copy {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 24px;
    }

    .hero-title {
      margin: 0;
      font-size: clamp(2.6rem, 5.4vw, 4.3rem);
      font-weight: 800;
      line-height: 0.96;
      letter-spacing: -0.06em;
      color: var(--text-primary);
      text-wrap: balance;
    }

    .split-layout .hero-title {
      font-size: clamp(2.1rem, 3.3vw, 3.2rem);
    }

    .hero-surname-wrap {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 16px 8px;
      border-radius: 14px;
      background: linear-gradient(135deg, #ffd43b 0%, #f5b700 100%);
      color: #0f172a;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.7) inset,
        0 10px 24px -10px rgba(245, 183, 0, 0.65);
    }

    .handle-float {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--bg-pill);
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-pill);
      backdrop-filter: blur(12px);
      font-family: var(--font-mono);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--accent-cobalt);
      text-decoration: none;
      width: fit-content;
      transform: rotate(-1.5deg);
      transition: transform 200ms var(--ease-out);
    }

    .handle-float:hover {
      transform: rotate(0deg) translateY(-1px);
    }

    .hero-role {
      margin: 0 0 6px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.03em;
    }

    .hero-tagline {
      margin: 0;
      font-size: 16.5px;
      line-height: 1.5;
      letter-spacing: -0.028em;
      color: var(--text-secondary);
      max-width: 44ch;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 12px;
      background: var(--text-primary);
      color: var(--bg-card);
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      transition: transform 180ms var(--ease-out), opacity 180ms var(--ease-out);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }

    .link-subtle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-secondary);
      text-decoration: none;
      white-space: nowrap;
      transition: color 160ms var(--ease-out);
    }

    .link-subtle:hover {
      color: var(--text-primary);
    }

    .hero-media-frame {
      position: relative;
      border-radius: 20px;
      aspect-ratio: 280 / 239;
      width: 100%;
      padding: 3.414% 4%;
      background: var(--hero-art-bg);
      border: 1px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      align-self: center;
    }

    .hero-media-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 10px;
      display: block;
      position: relative;
      z-index: 1;
    }

    /* ------------------------------------------------------------------
       02. Heatmap Card (Cubic Glass Matrix inspired by Ref 6)
    ------------------------------------------------------------------ */
    .section-head-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .section-title {
      margin: 0;
      font-size: clamp(1.75rem, 3vw, 2.35rem);
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 1.05;
      color: var(--text-primary);
    }

    .accent-green-text {
      color: var(--accent-green);
      font-size: 1.12em;
    }

    .heatmap-scroll {
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .heatmap-grid {
      display: grid;
      grid-template-rows: repeat(7, 1fr);
      grid-auto-flow: column;
      grid-auto-columns: minmax(11px, 1fr);
      gap: 4px;
      min-width: 680px;
    }

    .heat-cell {
      aspect-ratio: 1;
      border-radius: 4px;
      background: var(--heat-0);
      border: 1px solid rgba(15, 23, 42, 0.06);
      box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.35);
      transition: transform 140ms var(--ease-out);
      position: relative;
    }

    .profile-shell[data-theme="dark"] .heat-cell {
      border-color: rgba(255, 255, 255, 0.06);
      box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.12);
    }

    .heat-cell[data-level="1"] { background: var(--heat-1); }
    .heat-cell[data-level="2"] { background: var(--heat-2); }
    .heat-cell[data-level="3"] { background: var(--heat-3); }
    .heat-cell[data-level="4"] {
      background: var(--heat-4);
      box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.45), 0 0 10px rgba(16, 185, 129, 0.35);
    }

    .heat-cell:hover {
      transform: scale(1.28);
      z-index: 4;
    }

    .heatmap-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
    }

    .heat-legend {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .heat-legend .heat-cell {
      width: 13px;
      height: 13px;
    }

    /* ------------------------------------------------------------------
       03. Contributions Stats Card (Analytics layout inspired by Ref 1)
    ------------------------------------------------------------------ */
    .stats-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(240px, 0.85fr);
      gap: 32px;
      align-items: stretch;
    }

    .stats-left {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 24px;
    }

    .big-stat-number {
      font-size: clamp(3.2rem, 6vw, 4.75rem);
      font-weight: 800;
      line-height: 0.92;
      letter-spacing: -0.06em;
      color: var(--text-primary);
      margin: 0;
    }

    .big-stat-label {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.028em;
      color: var(--text-secondary);
      margin: 8px 0 0;
    }

    .bars-wrap {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 8px;
      align-items: end;
      height: 170px;
      padding-top: 24px;
    }

    .bar-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      gap: 8px;
    }

    .bar-val {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      min-height: 14px;
    }

    .bar-fill {
      width: 100%;
      border-radius: 6px 6px 3px 3px;
      background: var(--bar-muted);
      min-height: 6px;
      transition: transform 180ms var(--ease-out);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .bar-fill.peak {
      background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
    }

    .bar-fill.current {
      background: linear-gradient(180deg, #10b981 0%, #047857 100%);
    }

    .bar-name {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    .stats-right {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-left: 1px solid var(--border-hairline);
      padding-left: 28px;
    }

    .kpi-row {
      padding: 14px 0;
    }

    .kpi-row + .kpi-row {
      border-top: 1px solid var(--border-hairline);
    }

    .kpi-value {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.055em;
      line-height: 1;
      color: var(--text-primary);
    }

    .kpi-unit {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.025em;
      color: var(--text-secondary);
      margin-left: 6px;
    }

    .kpi-caption {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* ------------------------------------------------------------------
       04. Three Feature Cards (Build / Solve / Create)
       Directly inspired by Reference 3 (3-column rounded cards with
       clean top typography + luminous cubic glass radial orb below)
    ------------------------------------------------------------------ */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .pillar-card {
      min-height: 350px;
      padding: 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
    }

    .pillar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;

    ------------------------------------------------------------------ */

      font-weight: 700;

      color: var(--text-primary);

      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));

      font-weight: 600;

      color: var(--text-primary);

    .learn-mesh {
      background: radial-gradient(circle at 92% 90%, rgba(251, 191, 36, 0.42), transparent 58%);

    /* ------------------------------------------------------------------
       06. Tech Stack & How I Work (Architectural Tile Matrices)
    ------------------------------------------------------------------ */
    .stack-matrix {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .stack-cell {
      padding: 16px 18px;
      border-radius: 14px;
      background: var(--bg-card-subtle);
      border: 1px solid var(--border-hairline);

      align-items: center;
      justify-content: center;
      text-align: center;

      transform: translateY(-2px);
      border-color: var(--border-strong);
    }

    .stack-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.03em;
    }

    /* ------------------------------------------------------------------
       06b. My Workflow (Animated SVG Pipeline + Balanced 2x2 Step Grid)
    ------------------------------------------------------------------ */
    .wf-cubic-layer {
      mask-image: radial-gradient(ellipse 72% 72% at 92% 14%, #000 10%, transparent 72%);
      -webkit-mask-image: radial-gradient(ellipse 72% 72% at 92% 14%, #000 10%, transparent 72%);
    }

    .wf-mesh {
      background:
        radial-gradient(circle at 90% 14%, rgba(16, 185, 129, 0.28), transparent 52%),
        radial-gradient(circle at 72% 24%, rgba(37, 99, 235, 0.20), transparent 55%);
    }

    .wf-pipeline-box {
      border-radius: 18px;
      background: var(--bg-card-subtle);
      border: 1px solid var(--border-hairline);
      padding: 6px 8px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .wf-pipeline-svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .wf-flow {
      stroke-dasharray: 6 8;
      animation: wfDash 1.4s linear infinite;
    }

    .wf-ret {
      stroke-dasharray: 5 7;
      animation: wfRet 1.8s linear infinite;
    }

    .wf-spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: wfSpin 6s linear infinite;
    }

    .wf-spark {
      transform-box: fill-box;
      transform-origin: center;
      animation: wfSpark 2s ease-in-out infinite;
    }

    .wf-packet {
      animation: wfPacket 8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    .wf-s1 { animation: wfStep1 8s ease-in-out infinite; }
    .wf-s2 { animation: wfStep2 8s ease-in-out infinite; }
    .wf-s3 { animation: wfStep3 8s ease-in-out infinite; }
    .wf-s4 { animation: wfStep4 8s ease-in-out infinite; }
    .wf-ret-pulse { animation: wfRetPulse 8s ease-in-out infinite; }

    @keyframes wfDash { to { stroke-dashoffset: -28; } }
    @keyframes wfRet  { to { stroke-dashoffset: 24; } }
    @keyframes wfSpin { to { transform: rotate(360deg); } }
    @keyframes wfSpark {
      0%, 100% { transform: scale(1); opacity: 0.78; }
      50%      { transform: scale(1.12); opacity: 1; }
    }
    @keyframes wfPacket {
      0%, 17%  { transform: translateX(0px); opacity: 1; }
      25%, 42% { transform: translateX(226px); opacity: 1; }
      50%, 67% { transform: translateX(452px); opacity: 1; }
      75%, 90% { transform: translateX(678px); opacity: 1; }
      93%      { transform: translateX(678px); opacity: 0; }
      97%      { transform: translateX(0px); opacity: 0; }
      100%     { transform: translateX(0px); opacity: 1; }
    }
    @keyframes wfStep1 { 0%, 20% { opacity: 1; } 25%, 95% { opacity: 0.22; } 100% { opacity: 1; } }
    @keyframes wfStep2 { 0%, 20% { opacity: 0.22; } 25%, 45% { opacity: 1; } 50%, 100% { opacity: 0.22; } }
    @keyframes wfStep3 { 0%, 45% { opacity: 0.22; } 50%, 70% { opacity: 1; } 75%, 100% { opacity: 0.22; } }
    @keyframes wfStep4 { 0%, 70% { opacity: 0.22; } 75%, 95% { opacity: 1; } 100% { opacity: 0.22; } }
    @keyframes wfRetPulse { 0%, 84% { opacity: 0.22; } 91%, 97% { opacity: 0.95; } 100% { opacity: 0.22; } }

    .workflow-grid {

      *, *::before, *::after {
        transition: none !important;

        animation: none !important;
      }
    }

    };

    function esc(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function parseIso(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      return new Date(Date.UTC(y, m - 1, d));
    }

    function toIso(date) {
      return date.toISOString().slice(0, 10);
    }

    function addDays(date, n) {
      const d = new Date(date.getTime());
      d.setUTCDate(d.getUTCDate() + n);
      return d;
    }

    function computeStats(contrib) {
      const end = parseIso(contrib.end);
      const daysMap = contrib.days || {};
      const cnt = (d) => daysMap[toIso(d)] || 0;

      const start = addDays(end, -364);
      const win = [];
      for (let i = 0; i < 365; i++) win.push(addDays(start, i));

      const total = win.reduce((acc, d) => acc + cnt(d), 0);
      const active = win.filter((d) => cnt(d) > 0).length;
      const busiest = Math.max(0, ...win.map(cnt));

      let cursor = cnt(end) > 0 ? end : addDays(end, -1);
      let curStreak = 0;
      while (cnt(cursor) > 0 && cursor >= start) {
        curStreak += 1;
        cursor = addDays(cursor, -1);
      }

      let longest = 0, run = 0;
      for (const d of win) {
        run = cnt(d) > 0 ? run + 1 : 0;
        if (run > longest) longest = run;
      }

      const months = [];
      let y = end.getUTCFullYear();
      let m = end.getUTCMonth() + 1;
      for (let i = 0; i < 12; i++) {
        months.push([y, m]);
        m -= 1;
        if (m === 0) { y -= 1; m = 12; }
      }
      months.reverse();

      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const mt = months.map(([yr, mo]) => {
        const prefix = `${yr}-${String(mo).padStart(2, "0")}`;
        return Object.entries(daysMap).reduce((sum, [k, v]) => k.startsWith(prefix) ? sum + v : sum, 0);
      });
      const names = months.map(([, mo]) => monthNames[mo - 1]);

      // Heatmap aligned to Sunday start (weekday() + 1) % 7 in Python
      const pyWeekday = (start.getUTCDay() + 6) % 7; // Mon=0..Sun=6
      const gridStart = addDays(start, -((pyWeekday + 1) % 7));
      const cells = [];
      for (let d = new Date(gridStart); d <= end; d = addDays(d, 1)) {
        const iso = toIso(d);
        const c = daysMap[iso] || 0;
        const level = c === 0 ? 0 : c < 3 ? 1 : c < 6 ? 2 : c < 10 ? 3 : 4;
        cells.push({ date: iso, count: c, level });
      }

      return { total, active, busiest, curStreak, longest, mt, names, cells };
    }

    function cubicLayer(meshClass, extraLayerClass = "") {
      return `
        <div class="cubic-layer ${extraLayerClass}" aria-hidden="true">
          <div class="cubic-mesh ${meshClass}"></div>
          <div class="cubic-tiles"></div>
        </div>
      `;
    }

      const barsHtml = S.mt.map((v, idx) => {

        const showVal = v >= maxMonth * 0.25 && v > 0;
        return `

            <!-- What i Built -->
            <section id="section-projects">
              <div class="section-head-row" style="padding: 6px 4px 0; margin-bottom: 14px;">
                <p class="kicker" style="margin: 0;">
                  <span class="kicker-accent" style="background: var(--accent-red)"></span>
                  What I Built
                </p>
                <a href="${esc(reposUrl)}" target="_blank" rel="noopener noreferrer" class="link-subtle">
                  All Repositories ↗
                </a>
              </div>
              <div class="grid-3">
                ${projectsHtml}
              </div>
            </section>

            <!-- Contact -->
            <section id="section-contact" class="stack-col" style="gap: 12px;">
              <div class="contact-grid">
                ${contactsHtml}
              </div>
            </section>
          </div>
        </section>
      `;
    }

    function bindHeatmapTooltips() {
      const tip = document.getElementById("heat-tooltip");
      document.querySelectorAll(".heat-cell[data-date]").forEach(cell => {
        cell.addEventListener("mouseenter", () => {
          const rect = cell.getBoundingClientRect();
          const date = cell.getAttribute("data-date");
          const count = Number(cell.getAttribute("data-count"));
          tip.textContent = `${date} · ${count} contribution${count === 1 ? "" : "s"}`;
          tip.style.left = `${rect.left + rect.width / 2}px`;
          tip.style.top = `${rect.top}px`;
          tip.style.opacity = "1";
        });
        cell.addEventListener("mouseleave", () => {
          tip.style.opacity = "0";
        });
      });
    }

    function render() {
      const single = document.getElementById("view-single");
      const split = document.getElementById("view-split");

      if (state.mode === "split") {
        document.body.style.background = "#131720";
        single.style.display = "none";
        split.style.display = "grid";
        split.innerHTML =
          renderProfile("light", "Light Mode Preview") +
          renderProfile("dark", "Dark Mode Preview");
      } else {
        split.style.display = "none";
        single.style.display = "block";
        let activeTheme = state.mode;
        let label = "Light Mode Preview";
        if (state.mode === "dark") {
          label = "Dark Mode Preview";
        } else if (state.mode === "adaptive") {
          const isDarkOS = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          activeTheme = isDarkOS ? "dark" : "light";
          label = `Adaptive Mode (OS: ${activeTheme})`;
        }
        document.documentElement.setAttribute("data-theme", activeTheme);
        document.body.style.background = activeTheme === "dark" ? "#05070a" : "#f4f5f7";
        single.innerHTML = renderProfile(activeTheme, label);
      }

      bindHeatmapTooltips();
    }

    function setMode(mode) {
      state.mode = mode;
      document.querySelectorAll(".mode-switch button").forEach(b => b.classList.remove("active"));
      const btn = document.getElementById("btn-" + mode);
      if (btn) btn.classList.add("active");
      render();
    }

    async function hydrateData() {
      try {
        const [cfgRes, contribRes] = await Promise.allSettled([
          fetch("profile.config.json"),
          fetch("data/sample-contributions.json")
        ]);
        if (cfgRes.status === "fulfilled" && cfgRes.value.ok) {
          state.cfg = await cfgRes.value.json();
        }
        if (contribRes.status === "fulfilled" && contribRes.value.ok) {
          state.contrib = await contribRes.value.json();
        }
        render();
      } catch (_) {
        // Fallback embedded config & contributions already active
      }
    }

    if (window.matchMedia) {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
        if (state.mode === "adaptive") render();
      });
    }

    render();
    hydrateData();
  </script>
</body>
</html>
