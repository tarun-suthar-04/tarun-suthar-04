name: Update profile cards
on:
  schedule:
    - cron: "0 1 * * *"      # daily, 01:00 UTC
  workflow_dispatch:          # manual "Run workflow" button
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate SVG cards
        env:
          # Built-in token counts PUBLIC contributions only.
          # To include private ones: create a PAT (read:user scope), save it as repo secret GH_PAT,
          # and the script will use it automatically (add GH_PAT: ${{ secrets.GH_PAT }} below).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md
          git diff --cached --quiet || git commit -m "chore: update profile cards"
          git push
