name: Update profile cards
on:
  schedule:
    - cron: "0 1 * * *"          # daily at 01:00 UTC
  workflow_dispatch:              # manual "Run workflow" button
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/**'
      - 'README.md'
      - 'preview.html'
      - 'pkg/**'
      - 'data/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate SVG cards & sync live stats
        env:
          # Built-in token counts PUBLIC contributions
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: add repo secret GH_PAT with 'read:user' scope if you want to include private contributions
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/build.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md preview.html pkg data
          git diff --cached --quiet || git commit -m "chore: update profile cards and stats [skip ci]"
          git push
